name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  spring-boot-4:
    name: Java ${{ matrix.java }}, Spring Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
        boot: [ '4.0.8', '4.1.1' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify -pl '!gatepass-spring-boot3-starter' -Dspring-boot4.version=${{ matrix.boot }}

  spring-boot-3:
    name: Java ${{ matrix.java }}, Spring Boot 3.5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: >-
          ./mvnw -B -ntp verify -Pboot3
          -pl gatepass-test-support,gatepass-core,gatepass-spring-boot3-starter,integration-tests/servlet,integration-tests/reactive,integration-tests/gateway,integration-tests/gateway-mvc
